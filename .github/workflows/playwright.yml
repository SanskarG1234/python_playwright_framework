name: Playwright Automation Suite

# १. ही पाईपलाईन कधी रन झाली पाहिजे (Triggers)
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# २. प्रत्यक्ष काम काय करायचे आहे (Jobs)
jobs:
  test-execution:
    runs-on: ubuntu-latest # क्लाउडवर उबंटू (Linux) मशीन वापरणार

    steps:
    # स्टेप १: गिटहबवरून कोड क्लोन करणे
    - name: Checkout Code
      uses: actions/checkout@v4

    # स्टेप २: पायथन व्हर्जन इंस्टॉल करणे
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # स्टेप ३: डिपेंडन्सीज थेट कमांडने इंस्टॉल करणे
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright pytest pytest-html python-dotenv requests

    # 🚀 स्टेप ४: प्लेराईटचे इन-बिल्ट ब्राउझर इंस्टॉल करणे (खूप महत्त्वाचे ⭐)
    - name: Install Playwright Browsers
      run: playwright install --with-deps

    # स्टेप ५: पायटेस्ट रन करणे आणि रिपोर्ट तयार करणे (tests फोल्डरमधील टेस्टसाठी)
    - name: Run Playwright Tests
      run: pytest tests/ --html=reports/report.html --self-contained-html
      env:
        CI: "true"

    # स्टेप ६: टेस्ट संपल्यावर रिपोर्ट गिटहबवर अपलोड करणे (Artifacts)
    - name: Upload Test Report
      if: always() # टेस्ट पास होवो किंवा फेल, रिपोर्ट अपलोड होणारच
      uses: actions/upload-artifact@v4
      with:
        name: playwright-html-report
        path: reports/
